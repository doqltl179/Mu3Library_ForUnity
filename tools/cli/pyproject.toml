[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mu3-tools"
version = "0.1.0"
description = "Auxiliary repository tools for Mu3Library development and Unity automation workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12,<1.0",
]

# One command per tool; each also runs as python -m <package>. fixed_load is no command:
# compile-unity.sh and test-unity.sh run its fixed_load.py by path.
[project.scripts]
mu3-repo = "repo.cli:app"
mu3-unity = "unity.cli:app"
mu3-di-strip-harness = "strip_harness.cli:app"
mu3-multiplayer-harness = "multiplayer_harness.cli:app"
mu3-verify-build = "verify_build.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["common", "fixed_load", "multiplayer_harness", "repo", "strip_harness", "unity", "verify_build"]
