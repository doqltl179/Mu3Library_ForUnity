# agentkit project profile.
# This template is the schema: every key the kit reads appears here with its default and meaning.
# `agentkit.py install` copies it to .ai/project/profile.toml. Edit that copy, then run `agentkit.py sync`.
# Keys missing from a project's profile fall back to the defaults below.

[project]
name = ""                       # Project name shown to agents.
summary = ""                    # One sentence: what the project is and who uses it.
language = "en"                 # Language for human-facing output: reports, commits, pull requests, issues (for example "ko", "en").
guardrails = []                 # One-line project rules every agent follows on every task, shown in AGENTS.md «Project Rules»;
                                # for example "Features live in the packages; the sample projects only consume them".
                                # An entry that starts with "Replaces «<Section>» in <page>.md:" replaces the rules of that core wiki section
                                # it contradicts (ssot.md «Layers and Precedence»), for example
                                # "Replaces «When To Plan» in planning.md: a plan file starts at five steps instead of three".

[tools]
# AI tools to render adapter files for: "claude", "codex", "copilot", "cursor", "gemini".
# What each one generates is listed in core/wiki/integration/tool-adapters.md.
targets = ["claude", "codex", "copilot"]
keep_unmanaged = []             # Glob patterns of instruction files outside the kit kept on purpose; `check` stops reporting them.

[policy]
integration_branch = "main"     # Development branch: every work unit starts from it and its pull request targets it.
release_branch = "main"         # Release branch: when it differs from integration_branch, changes arrive only through a promotion from it (release.md «Promotion»).
                                # The same branch for both is trunk-based flow; a separate integration branch (for example "develop") adds promotion.
protected_branches = ["main"]   # Never commit directly; changes arrive only through merged pull requests, or with hosting.platform "none"
                                # through an approved merge (request-lifecycle.md «Scaling The Order»).
issue_first = false             # true: every work unit starts from an issue on the hosting platform (ignored when hosting.platform is "none").
worktrees = false               # true: every work unit runs in its own Git worktree cut from integration_branch. false: only a unit that runs alone works in the main checkout.
worktree_root = ".worktrees"    # Directory holding the worktrees, relative to the project root; kept out of Git by .gitignore.
work_root = ""                  # Root of the folders units make outside their checkout, as <work_root>/<project.name>/<unit> (git-workflow.md «Work Folders»):
                                # an absolute path, or one starting with "~" for the user's home, that every machine running the agents can use,
                                # or "env:NAME" when the root differs per machine: each machine sets the environment variable NAME to an absolute or "~" path on that machine.
                                # Empty, or NAME unset or empty: ask the user before making one.
max_parallel_units = 0          # Upper limit on units running at the same time on this machine; 0 means decide with `agentkit.py capacity`.
branch_pattern = "<type>/<scope>-<summary>"   # Task branch name; <type> is a Conventional Commits type when commit_convention is "conventional",
                                              # otherwise a short kind word such as "fix" or "feat" (git-workflow.md «Branch Policy»).
commit_convention = "none"      # "conventional" (Conventional Commits) or "none".
commit_language = ""            # Language of commit subjects and bodies; empty means project.language.
review_gate = "non-trivial"     # Which review-ready changes go through the agent review gates (review.md «Choosing Gates»): "all";
                                # "non-trivial", where trivial changes skip them; or "none", where only the project's own pull request review applies.

[hosting]
platform = "none"               # "github" or "none". Selects whether github-category skills apply; "none" also stops rendering them.
ci = false                      # true: the project runs CI on pull requests. false: verification evidence comes only from
                                # local runs recorded in pull requests (see release.md «Promotion»).
area_labels = []                # One label per project area, matching commit scopes, for example ["web", "api"].

[commands]
# Exact shell commands agents run from the project root. Empty means "not available":
# agents report the gap instead of guessing a substitute. Add more named commands when one kind has
# several surfaces (for example test_editmode, test_tools) and bind them to roles with `commands`
# in [bindings.<agent>].
install = ""
build = ""
test = ""
lint = ""
format = ""
typecheck = ""
e2e = ""
run = ""
worktree_setup = ""             # Run in a fresh worktree before work: recreate untracked links, local config, caches.
worktree_teardown = ""          # Run inside a worktree right before it is removed: undo what worktree_setup made that blocks removal, such as links or junctions.

[docs]
readme = "README.md"
changelog = ""                  # Changelog file, for example "CHANGELOG.md"; empty: the project keeps no changelog and the kit
                                # never creates one (documentation.md «Changelog»).
source_locale = ""              # Source language every translation starts from (BCP 47); empty means project.language.
specs_dir = ""                  # Directory of requirements specifications, for example "docs/specs"; empty: no spec files,
                                # the content goes where documentation.md «Specifications» puts it.
adr_dir = ""                    # Directory of architecture decision records, for example "docs/adr"; empty: no record files,
                                # the content goes where documentation.md «Decision Records» puts it.
glossary = ""                   # Project terms file: canonical term, meaning, synonyms to avoid, rendering per locale, and per-locale style notes;
                                # empty when the project keeps none. Start one from .ai/kit/core/templates/project/wiki/glossary.md,
                                # for example at ".ai/project/wiki/glossary.md".

[release]
tag_pattern = "v{version}"      # Tag of a release that covers the whole repository.

# [[release.packages]]
# One entry per separately versioned package, when a repository releases several (see release.md «Release Scope»).
# name = "core"
# version_file = "Packages/core/package.json"
# changelog = "Packages/core/CHANGELOG.md"
# tag_pattern = "core/v{version}"

[agents]
# Active core agents. Tokens: "*" (all), "@<department>", or "<agent-name>".
# Project-local agents in .ai/project/agents/ are always active.
enabled = ["@governance", "@quality", "@documentation", "@release"]
disabled = []

[skills]
# Active core skills. Tokens: "*" (all), "@<category>", or "<skill-name>".
# Project-local skills in .ai/project/skills/ are always active.
enabled = ["*"]
disabled = []

[stacks]
# Packs active without an agent binding (for example a language used everywhere).
active = []

# [stack_paths]
# Replace a pack's default path globs (its `applies_to`) for this project. The defaults stop
# applying, so also list each default glob the project still needs:
# typescript = ["apps/**/*.ts", "packages/**/*.ts"]

# [bindings.<agent-name>]
# Bind an active agent to this project's paths and stack packs; rendered into that agent's files.
# paths = ["apps/web/**"]
# stacks = ["typescript", "react"]
# commands = ["test_web"]      # Named commands under [commands] this role runs to verify its paths.
# notes = "Design system components live in packages/ui."

# [models.<tool>]
# Map agent tiers (deep, standard, light) to concrete models for one tool. Unset tiers use the tool default.
# deep = "opus"

[evolution]
upstream = "https://github.com/doqltl179/ai-agents"   # Kit repository used by kit-update and kit-upstream-propose.
propose_upstream = false        # true: agents propose kit changes upstream on their own when a lesson or fix holds for every project.
                                # false: kit-upstream-propose runs only when the user asks (memory-policy.md «Promotion»).
