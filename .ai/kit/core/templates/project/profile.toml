# agentkit project profile.
# This template is the schema: every key the kit reads appears here with its default and meaning.
# `agentkit.py install` copies it to .ai/project/profile.toml. Edit that copy, then run `agentkit.py sync`.
# Keys missing from a project's profile fall back to the defaults below.

[project]
name = ""                       # Project name shown to agents.
summary = ""                    # One sentence: what the project is and who uses it.
language = "en"                 # Language for human-facing output: reports, commits, pull requests, issues (for example "ko", "en").
guardrails = []                 # One-line project rules every agent follows on every task, shown in AGENTS.md «This Project»;
                                # for example "Features live in the packages; the sample projects only consume them".

[tools]
# AI tools to render adapter files for: "claude", "codex", "copilot", "cursor", "gemini".
# What each one generates is listed in core/wiki/integration/tool-adapters.md.
targets = ["claude", "codex", "copilot"]
keep_unmanaged = []             # Glob patterns of instruction files outside the kit kept on purpose; `check` stops reporting them.

[policy]
integration_branch = "develop"  # Development branch: every work unit starts from it and its pull request targets it.
release_branch = "main"         # Release branch: changes arrive only through a promotion pull request from integration_branch.
                                # Set both to the same branch for trunk-based flow.
protected_branches = ["develop", "main"]      # Never commit directly; changes arrive only through merged pull requests.
issue_first = true              # Every work unit starts from an issue on the hosting platform (ignored when hosting.platform is "none").
worktrees = true                # Every work unit runs in its own Git worktree cut from integration_branch.
worktree_root = ".worktrees"    # Directory holding the worktrees, relative to the project root; kept out of Git by .gitignore.
max_parallel_units = 0          # Upper limit on units running at the same time on this machine; 0 means decide with `agentkit.py capacity`.
branch_pattern = "<type>/<scope>-<summary>"   # Task branch name; <type> is a Conventional Commits type.
commit_convention = "conventional"            # "conventional" (Conventional Commits) or "none".
commit_language = ""            # Language of commit subjects and bodies; empty means project.language.

[hosting]
platform = "github"             # "github" or "none". Selects whether github-* skills apply.
ci = true                       # The project runs CI on pull requests. false: verification evidence comes only from
                                # local runs recorded in pull requests (see release.md «Promotion»).
area_labels = []                # One label per project area, matching commit scopes, for example ["web", "api"].

[commands]
# Exact shell commands agents run from the project root. Empty means "not available":
# agents report the gap instead of guessing a substitute. Add more named commands when one kind has
# several surfaces (for example test_editmode, test_tools) and bind them to roles with `commands`
# in [bindings.<agent>].
install = ""
build = ""
test = ""
lint = ""
format = ""
typecheck = ""
e2e = ""
run = ""
worktree_setup = ""             # Run in a fresh worktree before work: recreate untracked links, local config, caches.

[docs]
readme = "README.md"
changelog = "CHANGELOG.md"      # Empty when the project keeps no changelog.
source_locale = ""              # Source language every translation starts from (BCP 47); empty means project.language.
locales = []                    # Target languages of localized docs, kept in sync with the primary docs, for example ["ko", "ja"].
locale_pattern = "docs/{locale}/{name}"   # Path of a localized copy. Placeholders: {locale}, {name} (file name),
                                          # {stem} (name without extension), {ext} (extension with the dot).
specs_dir = "docs/specs"        # Requirements specifications.
adr_dir = "docs/adr"            # Architecture decision records.
glossary = ".ai/project/wiki/glossary.md"   # Terms and their approved rendering per locale, plus per-locale style notes.

# [docs.locale_paths]
# Per-document override of locale_pattern, keyed by the primary file:
# "README.md" = "docs/readme/README.{locale}.md"

[release]
tag_pattern = "v{version}"      # Tag of a release that covers the whole repository.

# [[release.packages]]
# One entry per separately versioned package, when a repository releases several (see release.md «Release Scope»).
# name = "core"
# version_file = "Packages/core/package.json"
# changelog = "Packages/core/CHANGELOG.md"
# tag_pattern = "core/v{version}"

[agents]
# Active core agents. Tokens: "*" (all), "@<department>", or "<agent-name>".
# Project-local agents in .ai/project/agents/ are always active.
enabled = ["@governance", "@quality", "@documentation", "@release"]
disabled = []

[skills]
# Active core skills. Tokens: "*" (all), "@<category>", or "<skill-name>".
# Project-local skills in .ai/project/skills/ are always active.
enabled = ["*"]
disabled = []

[stacks]
# Packs active without an agent binding (for example a language used everywhere).
active = []

# [stack_paths]
# Override a pack's default path globs for this project:
# typescript = ["apps/**/*.ts", "packages/**/*.ts"]

# [bindings.<agent-name>]
# Bind an active agent to this project's paths and stack packs; rendered into that agent's files.
# paths = ["apps/web/**"]
# stacks = ["typescript", "react"]
# commands = ["test_web"]      # Named commands under [commands] this role runs to verify its paths.
# notes = "Design system components live in packages/ui."

# [models.<tool>]
# Map agent tiers (deep, standard, light) to concrete models for one tool. Unset tiers use the tool default.
# deep = "opus"

[evolution]
upstream = "https://github.com/doqltl179/ai-agents"   # Kit repository used by kit-update and kit-upstream-propose.
