# agentkit project profile. [policy], [hosting], and [docs] write every value the project confirmed, even one that equals
# the kit default, so a kit update that changes a default leaves them as they are; the other sections keep only the keys
# this project sets differently («Profile» in .ai/kit/core/wiki/integration/project-overlay.md).
# Every key, its default, and its meaning: .ai/kit/core/templates/project/profile.toml

[project]
name = "Mu3Library_ForUnity"
summary = "Reusable Unity UPM packages (Addressables, Base, DI, Input System, Localization, Notifications, Steam, URP, Watermelon Game) that external Unity projects install through Git URLs; the tools generate the Unity projects that exercise them from the configs in tools/unity-projects."
language = "ko"
guardrails = [
    "Behavior lands in the packages under packages/; the projects generated from tools/unity-projects only consume and exercise them (.ai/project/wiki/overview.md).",
    "No breaking change to a package's public API unless the request asks for it.",
    "Verify package code with commands.build, which runs the Unity Editor CLI; never substitute dotnet build on the generated .csproj files.",
    "Test each feature's intent, role, and common usages; do not hunt situations no real use has shown, nor file a reviewer's hypothetical as a follow-up (.ai/project/lessons.md).",
    "README.md and CHANGELOG.md have ko and ja copies at docs/readme/README.{ko,ja}.md and docs/changelog/CHANGELOG.{ko,ja}.md; a unit changes only the English source, and each release unit brings all four copies up to their sources as a whole («Localized Copies» in .ai/project/wiki/package-release.md).",
    "Replaces «Worktrees» in git-workflow.md: a unit's worktree folder is <worktree_root>/<short-name> of the session's checkout, such as .worktrees/n430 for issue #430, not the branch name, to keep paths short (.ai/project/wiki/overview.md).",
    "Replaces «Cleanup» in git-workflow.md: a Claude app worktree (.claude/worktrees/<name>) that holds a unit's branch belongs to the app, so cleanup keeps it and moves it to the session's own branch instead of removing it (.ai/project/wiki/overview.md).",
]

[policy]
integration_branch = "develop"
release_branch = "main"
protected_branches = ["develop", "main"]
issue_first = true
# Kept after review on 2026-11-20 (#563): each unit's Library/ lies in its own work folder, so a worktree no longer costs
# an extra import, and a Claude app session already runs in a worktree of its own, where a unit that runs alone cuts its
# branch in place; a worktree per unit would only nest a second checkout to set up and remove (.ai/project/wiki/overview.md).
worktrees = false
# The root differs per machine, so each machine sets the user environment variable MU3_WORK_ROOT (.ai/project/wiki/overview.md).
work_root = "env:MU3_WORK_ROOT"
worktree_root = ".worktrees"
branch_pattern = "<type>/<scope>-<summary>"
commit_convention = "conventional"
review_gate = "non-trivial"

[hosting]
platform = "github"
ci = false
area_labels = ["base", "urp", "watermelon", "notifications", "inputsystem", "localization", "addressables", "di", "steam", "agents", "tooling"]

[commands]
build = "bash ./compile-unity.sh changed"
test = "bash ./test-unity.sh changed"
# The play-mode tests, which reach what only the player loop runs; minimal runs the DI core tests without UniTask.
test_playmode = "bash ./test-unity.sh changed --platform playmode"
test_tools = "PYTHONPATH=tools/cli/src python -m unittest discover -s tools/cli/tests"

[docs]
readme = "README.md"
changelog = "CHANGELOG.md"
source_locale = "en"
specs_dir = "docs/specs"
adr_dir = "docs/adr"
glossary = ".ai/project/wiki/glossary.md"

[[release.packages]]
name = "base"
version_file = "packages/base/package.json"
changelog = "packages/base/CHANGELOG.md"
tag_pattern = "base/v{version}"

[[release.packages]]
name = "urp"
version_file = "packages/urp/package.json"
changelog = "packages/urp/CHANGELOG.md"
tag_pattern = "urp/v{version}"

[[release.packages]]
name = "watermelon"
version_file = "packages/game/watermelon/package.json"
changelog = "packages/game/watermelon/CHANGELOG.md"
tag_pattern = "game/watermelon/v{version}"

[[release.packages]]
name = "notifications"
version_file = "packages/notifications/package.json"
changelog = "packages/notifications/CHANGELOG.md"
tag_pattern = "notifications/v{version}"

[[release.packages]]
name = "inputsystem"
version_file = "packages/inputsystem/package.json"
changelog = "packages/inputsystem/CHANGELOG.md"
tag_pattern = "inputsystem/v{version}"

[[release.packages]]
name = "localization"
version_file = "packages/localization/package.json"
changelog = "packages/localization/CHANGELOG.md"
tag_pattern = "localization/v{version}"

[[release.packages]]
name = "addressables"
version_file = "packages/addressables/package.json"
changelog = "packages/addressables/CHANGELOG.md"
tag_pattern = "addressables/v{version}"

[[release.packages]]
name = "di"
version_file = "packages/di/package.json"
changelog = "packages/di/CHANGELOG.md"
tag_pattern = "di/v{version}"

[[release.packages]]
name = "steam"
version_file = "packages/steam/package.json"
changelog = "packages/steam/CHANGELOG.md"
tag_pattern = "steam/v{version}"

[agents]
enabled = ["@governance", "@documentation", "@release", "code-reviewer", "game-runtime-engineer", "game-tools-engineer", "graphics-engineer", "devtools-engineer"]

[skills]
disabled = ["schema-migration", "accessibility-review-perform", "security-review-perform"]

[stack_paths]
# The packages live in packages/ at the repository root, not under Assets/ or Packages/, so neither pack's default globs reach them.
# "**/*.asmref", "**/*.unity", "**/*.prefab", "packages/**/Samples~/**", and "packages/**/Documentation~/**" match no
# tracked file today. They are intentional: they keep the file kinds the packs cover by default routed to the pack, so
# the first assembly reference, scene, prefab, sample, or package manual is too.
unity = ["packages/**/*.cs", "**/*.asmdef", "**/*.asmref", "**/*.unity", "**/*.prefab", "**/*.asset"]
unity-upm = ["packages/**/package.json", "packages/**/CHANGELOG.md", "packages/**/*.asmdef", "packages/**/Samples~/**", "packages/**/Documentation~/**"]

[bindings.game-runtime-engineer]
paths = ["packages/base/Runtime/**", "packages/base/Tests/**", "packages/notifications/Runtime/**", "packages/inputsystem/Runtime/**", "packages/inputsystem/Tests/**", "packages/localization/Runtime/**", "packages/localization/Tests/**", "packages/addressables/Runtime/**", "packages/addressables/Tests/**", "packages/di/Runtime/**", "packages/di/Tests/**", "packages/steam/Runtime/**", "packages/steam/Tests/**", "packages/game/watermelon/Runtime/**", "packages/game/watermelon/Tests/**"]
stacks = ["csharp", "unity", "unity-upm"]
commands = ["build", "test", "test_playmode"]
notes = "Runtime of reusable UPM packages shipped into other projects, not one game. This project keeps realtime-engineer off: Base's Multiplayer module and the Steam package's backend, lobbies, transport, and session flow included, route here. Compile targets and tests: .ai/project/wiki/unity-verification.md."

[bindings.game-tools-engineer]
paths = ["packages/base/Editor/**", "packages/inputsystem/Editor/**", "packages/localization/Editor/**", "packages/addressables/Editor/**", "packages/di/Editor/**"]
stacks = ["csharp", "unity", "unity-upm"]
commands = ["build"]
notes = "Editor tooling of the UPM packages. Compile targets and tests: .ai/project/wiki/unity-verification.md."

[bindings.graphics-engineer]
paths = ["packages/urp/Runtime/**", "packages/urp/Tests/**"]
stacks = ["csharp", "unity", "unity-upm"]
commands = ["build", "test"]
notes = "The URP package: camera, screen effects, renderer features, and shaders. Compile targets and tests: .ai/project/wiki/unity-verification.md."

[bindings.optional-integration-engineer]
paths = ["**/*.UniTask.cs", "**/*.Addressables.cs", "**/*.InputSystem.cs"]
stacks = ["csharp", "unity", "unity-upm"]
commands = ["build", "test", "test_playmode"]

[bindings.devtools-engineer]
paths = ["tools/**", "compile-unity.sh", "test-unity.sh", ".editorconfig", ".gitattributes"]
stacks = ["python", "shell"]
commands = ["test_tools"]
notes = "Repository support tooling only; it never owns Unity package behavior. Catalog: tools/README.md."

[bindings.technical-writer]
paths = ["README.md", "CHANGELOG.md", "packages/*/README.md", "packages/game/*/README.md", "packages/*/CHANGELOG.md", "packages/game/*/CHANGELOG.md", "docs/repository/**"]
notes = "Doc layout and the repository workflow changelog: .ai/project/wiki/overview.md."

[bindings.localization-specialist]
paths = ["docs/readme/**", "docs/changelog/**"]
notes = "Localized copies of README.md and CHANGELOG.md in ko and ja, brought up to their English sources in each release unit («Localized Copies» in .ai/project/wiki/package-release.md); terms in .ai/project/wiki/glossary.md."

[bindings.release-manager]
paths = ["packages/*/package.json", "packages/game/*/package.json"]
stacks = ["unity-upm"]
notes = "Packages, tags, and version files are in [[release.packages]]; root changelog headers, release titles, and notes: .ai/project/wiki/package-release.md."

[bindings.code-reviewer]
notes = "Package review focus: «Review Focus» in .ai/project/wiki/rules/package-architecture.md."

[bindings.kit-librarian]
paths = [".ai/project/**"]
