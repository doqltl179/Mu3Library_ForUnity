# agentkit project profile.
# This template is the schema: every key the kit reads appears here with its default and meaning.
# `agentkit.py install` copies it to .ai/project/profile.toml. Edit that copy, then run `agentkit.py sync`.
# Keys missing from a project's profile fall back to the defaults below.

[project]
name = "Mu3Library_ForUnity"           # Project name shown to agents.
summary = "Reusable Unity UPM packages (Base, URP, Watermelon Game) for external Unity projects; behavior lands in the Mu3Library_* packages, and the UnityProject_* projects only consume and exercise them (.ai/project/wiki/overview.md)."                    # One sentence: what the project is and who uses it.
language = "ko"                 # Language for human-facing output: reports, commits, pull requests, issues (for example "ko", "en").

[tools]
# AI tools to render adapter files for: "claude", "codex", "copilot", "cursor", "gemini".
# What each one generates is listed in core/wiki/integration/tool-adapters.md.
targets = ["claude", "codex", "copilot"]

[policy]
integration_branch = "develop"  # Development branch: every work unit starts from it and its pull request targets it.
release_branch = "main"         # Release branch: changes arrive only through a promotion pull request from integration_branch.
                                # Set both to the same branch for trunk-based flow.
protected_branches = ["develop", "main"]      # Never commit directly; changes arrive only through merged pull requests.
issue_first = true              # Every work unit starts from an issue on the hosting platform (ignored when hosting.platform is "none").
worktrees = false               # Every work unit runs in its own Git worktree cut from integration_branch.
worktree_root = ".worktrees"    # Directory holding the worktrees, relative to the project root; kept out of Git by .gitignore.
max_parallel_units = 0          # Upper limit on units running at the same time on this machine; 0 means decide with `agentkit.py capacity`.
branch_pattern = "<type>/<scope>-<summary>"   # Task branch name; <type> is a Conventional Commits type.
commit_convention = "conventional"            # "conventional" (Conventional Commits) or "none".
commit_language = ""            # Language of commit subjects and bodies; empty means project.language.

[hosting]
platform = "github"             # "github" or "none". Selects whether github-* skills apply.
area_labels = ["base", "urp", "watermelon", "agents", "tooling"]                # One label per project area, matching commit scopes, for example ["web", "api"].

[commands]
# Exact shell commands agents run from the project root. Empty means "not available":
# agents report the gap instead of guessing a substitute.
install = ""
build = "bash ./compile-unity.sh changed"
test = ""
lint = ""
format = ""
typecheck = ""
e2e = ""
run = ""

[docs]
readme = "README.md"
changelog = "CHANGELOG.md"      # Empty when the project keeps no changelog.
source_locale = "en"              # Source language every translation starts from (BCP 47); empty means project.language.
locales = ["ko", "ja"]                 # Target languages of localized docs, kept in sync with the primary docs, for example ["ko", "ja"].
locale_pattern = "docs/{stem-lower}/{stem}.{locale}.md"   # Path of a localized copy; {name} is the primary file name.
specs_dir = "docs/specs"        # Requirements specifications.
adr_dir = "docs/adr"            # Architecture decision records.
glossary = ".ai/project/wiki/glossary.md"   # Terms and their approved rendering per locale, plus per-locale style notes.

[agents]
# Active core agents. Tokens: "*" (all), "@<department>", or "<agent-name>".
# Project-local agents in .ai/project/agents/ are always active.
enabled = ["@governance", "@documentation", "@release", "code-reviewer", "game-runtime-engineer", "game-tools-engineer", "graphics-engineer", "devtools-engineer"]
disabled = []

[skills]
# Active core skills. Tokens: "*" (all), "@<category>", or "<skill-name>".
# Project-local skills in .ai/project/skills/ are always active.
enabled = ["*"]
disabled = ["schema-migration", "accessibility-review-perform", "security-review-perform", "ci-failure-triage", "kit-trend-scan", "kit-stack-add"]

[stacks]
# Packs active without an agent binding (for example a language used everywhere).
active = []

[stack_paths]
# The packages live at the repository root, not under Assets/ or Packages/, so the unity pack's default globs miss them.
unity = ["Mu3Library_*/**/*.cs", "UnityProject_*/Assets/**/*.cs", "**/*.asmdef", "**/*.asmref", "**/*.unity", "**/*.prefab", "**/*.asset"]

[bindings.game-runtime-engineer]
paths = ["Mu3Library_Base/Runtime/**", "Mu3Library_Base/Tests/**", "Mu3Library_Game_WatermelonGame/Runtime/**", "Mu3Library_Game_WatermelonGame/Tests/**"]
stacks = ["csharp", "unity"]
notes = "Runtime of reusable UPM packages shipped into other projects, not one game. Package rules: .ai/project/wiki/package-architecture.md; compile and tests: .ai/project/wiki/unity-verification.md."

[bindings.game-tools-engineer]
paths = ["Mu3Library_Base/Editor/**", "Mu3Library_URP/Editor/**"]
stacks = ["csharp", "unity"]
notes = "Editor tooling of the UPM packages. Package rules: .ai/project/wiki/package-architecture.md; compile and tests: .ai/project/wiki/unity-verification.md."

[bindings.graphics-engineer]
paths = ["Mu3Library_URP/Runtime/**"]
stacks = ["csharp", "unity"]
notes = "The URP package: camera, screen effects, renderer features, and shaders. Package rules: .ai/project/wiki/package-architecture.md."

[bindings.optional-integration-engineer]
paths = ["**/*.UniTask.cs", "**/*.Addressables.cs", "Mu3Library_Base/Runtime/Scripts/Addressable/**", "Mu3Library_Base/Runtime/Scripts/Localization/**", "Mu3Library_Base/Runtime/Scripts/IS/**"]
stacks = ["csharp", "unity"]

[bindings.sample-integrity-engineer]
paths = ["Mu3Library_*/Samples~/**"]
stacks = ["csharp", "unity"]

[bindings.devtools-engineer]
paths = ["tools/**", "compile-unity.sh", "unity-cli-packages.tsv", ".editorconfig", ".gitattributes"]
stacks = ["python", "shell"]
notes = "Repository support tooling only; it never owns Unity package behavior. Catalog: tools/README.md."

[bindings.technical-writer]
paths = ["README.md", "CHANGELOG.md", "Mu3Library_*/README.md", "Mu3Library_*/CHANGELOG.md", "docs/repository/**"]
notes = "Doc layout and the repository workflow changelog: .ai/project/wiki/overview.md."

[bindings.localization-specialist]
paths = ["docs/readme/**", "docs/changelog/**"]
notes = "Localized copies of README.md and CHANGELOG.md in ko and ja; terms in .ai/project/wiki/glossary.md."

[bindings.release-manager]
paths = ["Mu3Library_*/package.json"]
notes = "Three packages version and tag independently: .ai/project/wiki/package-release.md."

[bindings.code-reviewer]
notes = "Review focus for this package repository: «Review Focus» in .ai/project/wiki/package-architecture.md."

[bindings.kit-librarian]
paths = [".ai/project/**"]

# [stack_paths]
# Override a pack's default path globs for this project:
# typescript = ["apps/**/*.ts", "packages/**/*.ts"]

# [bindings.<agent-name>]
# Bind an active agent to this project's paths and stack packs; rendered into that agent's files.
# paths = ["apps/web/**"]
# stacks = ["typescript", "react"]
# notes = "Design system components live in packages/ui."

# [models.<tool>]
# Map agent tiers (deep, standard, light) to concrete models for one tool. Unset tiers use the tool default.
# deep = "opus"

[evolution]
upstream = "https://github.com/doqltl179/ai-agents"   # Kit repository used by kit-update and kit-upstream-propose.
