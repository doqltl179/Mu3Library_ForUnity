# agentkit project profile. Keep only the keys this project sets differently from the kit defaults:
# a key that merely repeats a default would pin today's default when a kit update changes it.
# Every key, its default, and its meaning: .ai/kit/core/templates/project/profile.toml

[project]
name = "Mu3Library_ForUnity"
summary = "Reusable Unity UPM packages (Base, Notifications, URP, Watermelon Game) that external Unity projects install through Git URLs; the tools generate the Unity projects that exercise them from the configs in tools/unity-projects."
language = "ko"
guardrails = [
    "Behavior lands in the packages under packages/; the projects generated from tools/unity-projects only consume and exercise them (.ai/project/wiki/overview.md).",
    "No breaking change to a package's public API unless the request asks for it.",
    "Verify package code with commands.build, which runs the Unity Editor CLI; never substitute dotnet build on the generated .csproj files.",
    "Test each feature's intent, role, and common usages; do not hunt situations no real use has shown, nor file a reviewer's hypothetical as a follow-up (.ai/project/lessons.md).",
]

[policy]
# Set while each committed development project's Library/ (1.3-2.3 GB) made a fresh worktree re-import it; the generated
# projects now keep Library/ in the unit's work folder instead (.ai/project/wiki/overview.md).
worktrees = false
# The root differs per machine, so each machine sets the user environment variable MU3_WORK_ROOT (.ai/project/wiki/overview.md).
work_root = "env:MU3_WORK_ROOT"

[hosting]
ci = false
area_labels = ["base", "urp", "watermelon", "agents", "tooling"]

[commands]
build = "bash ./compile-unity.sh changed"
test = "bash ./test-unity.sh changed"
# The play-mode tests, which reach what only the player loop runs; minimal and urp run them without UniTask.
test_playmode = "bash ./test-unity.sh changed --platform playmode"
test_tools = "PYTHONPATH=tools/cli/src python -m unittest discover -s tools/cli/tests"

[docs]
source_locale = "en"
locales = ["ko", "ja"]

[docs.locale_paths]
"README.md" = "docs/readme/README.{locale}.md"
"CHANGELOG.md" = "docs/changelog/CHANGELOG.{locale}.md"

[[release.packages]]
name = "base"
version_file = "packages/base/package.json"
changelog = "packages/base/CHANGELOG.md"
tag_pattern = "base/v{version}"

[[release.packages]]
name = "urp"
version_file = "packages/urp/package.json"
changelog = "packages/urp/CHANGELOG.md"
tag_pattern = "urp/v{version}"

[[release.packages]]
name = "watermelon"
version_file = "packages/game/watermelon/package.json"
changelog = "packages/game/watermelon/CHANGELOG.md"
tag_pattern = "game/watermelon/v{version}"

[[release.packages]]
name = "notifications"
version_file = "packages/notifications/package.json"
changelog = "packages/notifications/CHANGELOG.md"
tag_pattern = "notifications/v{version}"

[agents]
enabled = ["@governance", "@documentation", "@release", "code-reviewer", "game-runtime-engineer", "game-tools-engineer", "graphics-engineer", "devtools-engineer"]

[skills]
disabled = ["schema-migration", "accessibility-review-perform", "security-review-perform", "kit-trend-scan"]

[stack_paths]
# The packages live in packages/ at the repository root, not under Assets/ or Packages/, so neither pack's default globs reach them.
# "**/*.asmref" and "packages/**/Documentation~/**" match no tracked file today. They are intentional: they keep the
# file kinds the packs cover by default routed to the pack, so the first assembly reference or package manual is too.
unity = ["packages/**/*.cs", "**/*.asmdef", "**/*.asmref", "**/*.unity", "**/*.prefab", "**/*.asset"]
unity-upm = ["packages/**/package.json", "packages/**/CHANGELOG.md", "packages/**/*.asmdef", "packages/**/Samples~/**", "packages/**/Documentation~/**"]

[bindings.game-runtime-engineer]
paths = ["packages/base/Runtime/**", "packages/base/Tests/**", "packages/notifications/Runtime/**", "packages/game/watermelon/Runtime/**", "packages/game/watermelon/Tests/**"]
stacks = ["csharp", "unity", "unity-upm"]
commands = ["build", "test", "test_playmode"]
notes = "Runtime of reusable UPM packages shipped into other projects, not one game. Compile targets and tests: .ai/project/wiki/unity-verification.md."

[bindings.game-tools-engineer]
paths = ["packages/base/Editor/**"]
stacks = ["csharp", "unity", "unity-upm"]
commands = ["build"]
notes = "Editor tooling of the UPM packages. Compile targets and tests: .ai/project/wiki/unity-verification.md."

[bindings.graphics-engineer]
paths = ["packages/urp/Runtime/**", "packages/urp/Tests/**"]
stacks = ["csharp", "unity", "unity-upm"]
commands = ["build", "test"]
notes = "The URP package: camera, screen effects, renderer features, and shaders. Compile targets and tests: .ai/project/wiki/unity-verification.md."

[bindings.optional-integration-engineer]
paths = ["**/*.UniTask.cs", "**/*.Addressables.cs", "**/*.InputSystem.cs", "packages/base/Runtime/Addressable/**", "packages/base/Runtime/Localization/**", "packages/base/Runtime/IS/**"]
stacks = ["csharp", "unity", "unity-upm"]
commands = ["build", "test", "test_playmode"]

[bindings.sample-integrity-engineer]
paths = ["packages/**/Samples~/**"]
stacks = ["csharp", "unity", "unity-upm"]
commands = ["build"]

[bindings.devtools-engineer]
paths = ["tools/**", "compile-unity.sh", "test-unity.sh", ".editorconfig", ".gitattributes"]
stacks = ["python", "shell"]
commands = ["test_tools"]
notes = "Repository support tooling only; it never owns Unity package behavior. Catalog: tools/README.md."

[bindings.technical-writer]
paths = ["README.md", "CHANGELOG.md", "packages/*/README.md", "packages/game/*/README.md", "packages/*/CHANGELOG.md", "packages/game/*/CHANGELOG.md", "docs/repository/**"]
notes = "Doc layout and the repository workflow changelog: .ai/project/wiki/overview.md."

[bindings.localization-specialist]
paths = ["docs/readme/**", "docs/changelog/**"]
notes = "Localized copies of README.md and CHANGELOG.md in ko and ja; terms in .ai/project/wiki/glossary.md."

[bindings.release-manager]
paths = ["packages/*/package.json", "packages/game/*/package.json"]
stacks = ["unity-upm"]
notes = "Packages, tags, and version files are in [[release.packages]]; root changelog headers, release titles, and notes: .ai/project/wiki/package-release.md."

[bindings.code-reviewer]
notes = "Package review focus: «Review Focus» in .ai/project/wiki/rules/package-architecture.md."

[bindings.kit-librarian]
paths = [".ai/project/**"]
