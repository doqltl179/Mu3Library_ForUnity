name: Branch Strategy

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate-branch-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Validate develop/main flow
        shell: bash
        run: |
          set -euo pipefail

          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"

          echo "base=$BASE"
          echo "head=$HEAD"

          if [[ "$BASE" == "main" ]]; then
            if [[ "$HEAD" == "develop" ]]; then
              exit 0
            fi
            echo "PRs into main must come from develop."
            exit 1
          fi

          if [[ "$BASE" == "develop" ]]; then
            if [[ "$HEAD" == "main" ]]; then
              exit 0
            fi

            echo "PRs into develop must come from main for release sync."
            exit 1
          fi

          echo "Unexpected PR target branch: $BASE"
          exit 1
